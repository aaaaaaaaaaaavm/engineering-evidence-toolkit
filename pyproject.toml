[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-evidence-toolkit"
version = "0.1.2"
description = "Traceability checks for computational engineering repositories"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Adityavardhan Mishra"}]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
engtrace = "engtrace.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
